<script>

const BA = 'Attempt Breach';
const BE = 'EKL Issue';
const BR = 'Auto Reset';
const BD = 'Dispatch breach';

const ALL = [BA,BE,BR,BD];
const PICKUP = [BA,BE,BR];

let RAW = [];
let DATES = [];
let filtered = [];

let periods = [1,1,1];
let kpiPeriod = 1;

let selectedDates = new Set();

let chartTrend = null;
let chartMix = null;

/* Start sorting by Hub */
let sortState = [
  {col:0,asc:true},
  {col:0,asc:true},
  {col:0,asc:true}
];

function N(num) {
  return (num || 0).toLocaleString();
}

function setS(type, msg) {
  const sb = document.getElementById('sbar');
  if (type === 'err') {
    sb.innerHTML = '❌ <span style="color:var(--red);font-weight:600">' + msg + '</span>';
  } else {
    sb.innerHTML = msg;
  }
}

async function loadData(){
  try{
    const response = await fetch('data.json');
    if(!response.ok){
      throw new Error('HTTP ' + response.status);
    }
    const rows = await response.json();
    init(rows);
  }catch(e){
    setS('err', 'Failed to load data.json: ' + e.message);
  }
}

function dv(s){
  if(!s) return 0;
  const p = s.split('-');
  return new Date(p[2] + '-' + p[1] + '-' + p[0]).getTime();
}

function init(rows){
  RAW = rows.map(r => ({
    ...r,
    picked: r.total_picked || r.picked || r.picked_count || 0
  }));

  DATES = [...new Set(RAW.map(r => r.date))].sort((a,b) => dv(b) - dv(a));
  selectedDates = new Set();

  document.getElementById('hdr-meta').textContent =
    DATES.length + ' dates · ' +
    RAW.length.toLocaleString() +
    ' records · Latest: ' +
    DATES[0];

  buildFilters();
  applyFilters();

  setS('ok', '✓ Ready — ' + RAW.length.toLocaleString() + ' records across ' + DATES.length + ' dates');
}

function buildDateList(){
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  const active = activeDates();

  DATES.forEach(d => {
    const item = document.createElement('label');
    item.className = 'date-item';

    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.value = d;
    chk.checked = selectedDates.size === 0 || active.has(d);

    chk.onchange = () => {
      if(selectedDates.size === 0){
        selectedDates = new Set(DATES);
      }
      if(chk.checked){
        selectedDates.add(d);
      }else{
        selectedDates.delete(d);
      }
      if(selectedDates.size === DATES.length){
        selectedDates = new Set();
      }
      updateDateBtnLabel();
      applyFilters();
    };

    item.appendChild(chk);
    item.appendChild(document.createTextNode(d));
    list.appendChild(item);
  });

  updateDateBtnLabel();
}

function selectAllDates(){
  selectedDates = new Set();
  buildDateList();
  applyFilters();
}

function clearAllDates(){
  selectedDates = new Set(['__none__']);
  buildDateList();
  applyFilters();
}

function updateDateBtnLabel(){
  const lbl = document.getElementById('date-btn-label');
  if(selectedDates.size === 0){
    lbl.textContent = 'All Dates';
  }else if(selectedDates.has('__none__')){
    lbl.textContent = 'None selected';
  }else if(selectedDates.size === 1){
    lbl.textContent = [...selectedDates][0];
  }else{
    lbl.textContent = selectedDates.size + ' dates selected';
  }
}

function toggleDateDD(e){
  e.stopPropagation();
  document.getElementById('date-dd').classList.toggle('open');
}

document.addEventListener('click', e => {
  if(!document.getElementById('date-fg').contains(e.target)){
    document.getElementById('date-dd').classList.remove('open');
  }
});

function activeDates(){
  if(selectedDates.size === 0){
    return new Set(DATES);
  }
  if(selectedDates.has('__none__')){
    return new Set();
  }
  return selectedDates;
}

function buildFilters(){
  const uniq = k => [...new Set(RAW.map(r => r[k]).filter(Boolean))].sort();

  pop('f-zone',uniq('zone'));
  pop('f-gm',uniq('gm'));
  pop('f-rm',uniq('rm'));
  pop('f-am',uniq('am'));
  pop('f-ph',uniq('ph'));

  buildDateList();
}

function pop(id,vals){
  const el = document.getElementById(id);
  el.innerHTML = '<option value="">All</option>';

  vals.forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });
}

const fv = id => document.getElementById(id).value;

function resetFilters(){
  ['f-zone','f-gm','f-rm','f-am','f-ph'].forEach(id => {
    document.getElementById(id).value = '';
  });

  document.getElementById('f-type').value = 'all';
  selectedDates = new Set();

  buildDateList();
  applyFilters();
}

function applyFilters(){
  const zone = fv('f-zone');
  const gm = fv('f-gm');
  const rm = fv('f-rm');
  const am = fv('f-am');
  const ph = fv('f-ph');
  const type = fv('f-type');

  const ad = activeDates();

  filtered = RAW.filter(r =>
    ad.has(r.date) &&
    (!zone || r.zone === zone) &&
    (!gm || r.gm === gm) &&
    (!rm || r.rm === rm) &&
    (!am || r.am === am) &&
    (!ph || r.ph === ph) &&
    (type !== 'cpd' || r.cpd)
  );

  renderKPIs();
  renderCharts();
  renderAll();
}

function datesForN(n){
  const available = DATES.filter(d => activeDates().has(d));
  if(n === 999){
    return new Set(available);
  }
  return new Set(available.slice(0,n));
}

function setKpiP(days,el){
  kpiPeriod = days;
  document.getElementById('tp-kpi').querySelectorAll('.pt').forEach(t => t.classList.remove('on'));
  el.classList.add('on');

  renderKPIs();
  renderCharts();
}

function renderKPIs(){
  const ds = datesForN(kpiPeriod);
  const rows = filtered.filter(r => ds.has(r.date));

  const cnt = buckets =>
    rows.filter(r => buckets.includes(r.bucket))
        .reduce((sum,r) => sum + (r.cnt || 0), 0);

  const pickedCount = rows.reduce((sum,r) => sum + (r.picked || 0), 0);

  const label = kpiPeriod === 1 ? 'D-1' : kpiPeriod === 999 ? 'Overall' : 'Last ' + kpiPeriod + ' Days';

  document.getElementById('kpi-bar').innerHTML =
    '<div class="kpi k0">' +
      '<div class="k-lbl">Total Breaches (' + label + ')</div>' +
      '<div class="k-val">' + N(cnt(ALL)) + '</div>' +
    '</div>' +

    '<div class="kpi k5">' +
      '<div class="k-lbl">Picked Count</div>' +
      '<div class="k-val">' + N(pickedCount) + '</div>' +
    '</div>' +

    '<div class="kpi k1">' +
      '<div class="k-lbl">Attempt Breach</div>' +
      '<div class="k-val">' + N(cnt([BA])) + '</div>' +
    '</div>' +

    '<div class="kpi k2">' +
      '<div class="k-lbl">EKL Issue</div>' +
      '<div class="k-val">' + N(cnt([BE])) + '</div>' +
    '</div>' +

    '<div class="kpi k3">' +
      '<div class="k-lbl">Auto Reset</div>' +
      '<div class="k-val">' + N(cnt([BR])) + '</div>' +
    '</div>' +

    '<div class="kpi k4">' +
      '<div class="k-lbl">Dispatch Breach</div>' +
      '<div class="k-val">' + N(cnt([BD])) + '</div>' +
    '</div>';
}

function renderCharts(){
  const ds = datesForN(kpiPeriod);
  const rows = filtered.filter(r => ds.has(r.date));

  const tDates = [...new Set(rows.map(r => r.date))].sort((a,b) => dv(a) - dv(b));

  const getCount = (date,bucket) =>
    rows.filter(r => r.date === date && r.bucket === bucket)
        .reduce((sum,r) => sum + (r.cnt || 0), 0);

  if(chartTrend){
    chartTrend.destroy();
  }

  chartTrend = new Chart(
    document.getElementById('chart-trend').getContext('2d'),
    {
      type:'bar',
      data:{
        labels:tDates,
        datasets:[
          { label:'Attempt', data:tDates.map(d => getCount(d,BA)), backgroundColor:'#DC2626', stack:'s' },
          { label:'EKL', data:tDates.map(d => getCount(d,BE)), backgroundColor:'#7C3AED', stack:'s' },
          { label:'Auto Reset', data:tDates.map(d => getCount(d,BR)), backgroundColor:'#059669', stack:'s' },
          { label:'Dispatch', data:tDates.map(d => getCount(d,BD)), backgroundColor:'#D97706', stack:'s' }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom' } }
      }
    }
  );

  const mix = [BA,BE,BR,BD].map(bucket =>
    rows.filter(r => r.bucket === bucket)
        .reduce((sum,r) => sum + (r.cnt || 0), 0)
  );

  if(chartMix){
    chartMix.destroy();
  }

  chartMix = new Chart(
    document.getElementById('chart-mix').getContext('2d'),
    {
      type:'doughnut',
      data:{
        labels:['Attempt', 'EKL Issue', 'Auto Reset', 'Dispatch'],
        datasets:[{
          data:mix,
          backgroundColor:['#DC2626', '#7C3AED', '#059669', '#D97706']
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom' } }
      }
    }
  );
}

function setP(sec,days,el){
  periods[sec] = days;
  document.getElementById('tp' + sec).querySelectorAll('.pt').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  renderSec(sec);
}

function renderAll(){
  [0,1,2].forEach(i => renderSec(i));
}

function sortRows(rows,col,asc,buckets){
  const sA = buckets.includes(BA);
  const sE = buckets.includes(BE);
  const sR = buckets.includes(BR);
  const sD = buckets.includes(BD);

  let key;

  if(col === 0) key = 'ph';
  else if(col === 1) key = 'zone';
  else if(col === 2) key = 'gm';
  else if(col === 3) key = 'rm';
  else if(col === 4) key = 'am';
  else if(col === 5) key = 'p'; 
  else{
    const numericKeys = [];
    if(sA) numericKeys.push('a');
    if(sE) numericKeys.push('e');
    if(sR) numericKeys.push('ar');
    if(sD) numericKeys.push('d');
    numericKeys.push('t');

    key = numericKeys[col - 6] || 't';
  }

  return [...rows].sort((a,b) => {
    const av = a[key];
    const bv = b[key];

    if(typeof av === 'string'){
      return asc ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    return asc ? av - bv : bv - av;
  });
}

function renderSec(sec){
  const buckets = sec === 0 ? ALL : sec === 1 ? PICKUP : [BD];
  const ds = datesForN(periods[sec]);
  const periodDays = ds.size || 1;
  const showAverage = periodDays > 1;

  const rows = filtered.filter(r => ds.has(r.date) && buckets.includes(r.bucket));
  const agg = {};

  rows.forEach(r => {
    const key = r.ph + '||' + r.zone + '||' + r.gm + '||' + r.rm + '||' + r.am;

    if(!agg[key]){
      agg[key] = {
        ph:r.ph,
        zone:r.zone,
        gm:r.gm,
        rm:r.rm,
        am:r.am,
        p:0,
        a:0,
        e:0,
        ar:0,
        d:0,
        t:0,
        byDate:{}
      };
    }

    if(!agg[key].byDate[r.date]){
      agg[key].byDate[r.date] = {
        p:0,
        a:0,
        e:0,
        ar:0,
        d:0,
        t:0
      };
    }

    const countVal = r.cnt || 0;
    const pickedVal = r.picked || 0;

    agg[key].p += pickedVal;
    agg[key].byDate[r.date].p += pickedVal;

    if(r.bucket === BA){
      agg[key].a += countVal;
      agg[key].byDate[r.date].a += countVal;
    }

    if(r.bucket === BE){
      agg[key].e += countVal;
      agg[key].byDate[r.date].e += countVal;
    }

    if(r.bucket === BR){
      agg[key].ar += countVal;
      agg[key].byDate[r.date].ar += countVal;
    }

    if(r.bucket === BD){
      agg[key].d += countVal;
      agg[key].byDate[r.date].d += countVal;
    }

    agg[key].t += countVal;
    agg[key].byDate[r.date].t += countVal;
  });

  const ss = sortState[sec];
  const hubRows = sortRows(Object.values(agg), ss.col, ss.asc, buckets);

  const gt = { p:0, a:0, e:0, ar:0, d:0, t:0 };

  hubRows.forEach(r => {
    gt.p += r.p;
    gt.a += r.a;
    gt.e += r.e;
    gt.ar += r.ar;
    gt.d += r.d;
    gt.t += r.t;
  });

  const tbl = document.getElementById('t' + sec);

  if(!hubRows.length){
    tbl.innerHTML = '<tbody><tr><td class="no-data">No data for this selection.</td></tr></tbody>';
    return;
  }

  const sA = buckets.includes(BA);
  const sE = buckets.includes(BE);
  const sR = buckets.includes(BR);
  const sD = buckets.includes(BD);

  const thC = (label,ci,cls='') => {
    const sortedClass = ss.col === ci ? (ss.asc ? ' sorted-asc' : ' sorted-desc') : '';
    return '<th class="' + cls + sortedClass + '" onclick="doSort(' + sec + ',' + ci + ')">' +
      label + ' <span class="si"></span></th>';
  };

  const prefix = showAverage ? 'Avg ' : '';
  let numCI = 5;

  let header =
    '<thead><tr>' +
    thC('Hub',0) +
    thC('Zone',1) +
    thC('GM',2) +
    thC('RM',3) +
    thC('AM',4) +
    thC(prefix + 'Picked Count', numCI++, 'r');

  if(sA) header += thC(prefix + 'Attempt Breach', numCI++, 'r');
  if(sE) header += thC(prefix + 'EKL Issue', numCI++, 'r');
  if(sR) header += thC(prefix + 'Auto Reset', numCI++, 'r');
  if(sD) header += thC(prefix + 'Dispatch Breach', numCI++, 'r');

  header += thC(showAverage ? 'Avg Daily Total' : 'Grand Total', numCI, 'r');
  header += '</tr></thead>';

  const zbadge = z => '<span class="zbadge z-' + (z || 'Unknown') + '">' + (z || '?') + '</span>';

  const formatValue = value => {
    if(showAverage){
      return (value / periodDays).toLocaleString(undefined, {
        minimumFractionDigits:1,
        maximumFractionDigits:1
      });
    }
    return N(value);
  };

  const cells = d => {
    let html = '<td class="r" style="color:var(--teal);font-weight:700">' + formatValue(d.p) + '</td>';

    if(sA) html += '<td class="r">' + formatValue(d.a) + '</td>';
    if(sE) html += '<td class="r">' + formatValue(d.e) + '</td>';
    if(sR) html += '<td class="r">' + formatValue(d.ar) + '</td>';
    if(sD) html += '<td class="r">' + formatValue(d.d) + '</td>';

    html += '<td class="r" style="color:var(--blue);font-weight:700">' + formatValue(d.t) + '</td>';
    return html;
  };

  const totalCols = 6 + [sA,sE,sR,sD].filter(Boolean).length + 1;

  let body = '<tbody>';

  hubRows.forEach((r,index) => {
    const subId = 'sub-' + sec + '-' + index;
    const btnId = 'btn-' + sec + '-' + index;

    const dateList = Object.keys(r.byDate).sort((a,b) => dv(b) - dv(a));
    let dateRows = '';

    dateList.forEach(date => {
      const data = r.byDate[date];
      dateRows +=
        '<tr>' +
        '<td style="font-weight:600;color:var(--navy2)">' + date + '</td>' +
        '<td class="r" style="color:var(--teal);font-weight:700">' + N(data.p) + '</td>';

      if(sA) dateRows += '<td class="r">' + N(data.a) + '</td>';
      if(sE) dateRows += '<td class="r">' + N(data.e) + '</td>';
      if(sR) dateRows += '<td class="r">' + N(data.ar) + '</td>';
      if(sD) dateRows += '<td class="r">' + N(data.d) + '</td>';

      dateRows += '<td class="r" style="color:var(--blue);font-weight:700">' + N(data.t) + '</td></tr>';
    });

    body +=
      '<tr>' +
      '<td style="max-width:230px;overflow:hidden;text-overflow:ellipsis">' +
      '<span id="' + btnId + '" class="expand-btn" onclick="toggleHubSubRow(\'' + subId + '\',\'' + btnId + '\')">▶</span>' +
      '<strong style="cursor:pointer" onclick="toggleHubSubRow(\'' + subId + '\',\'' + btnId + '\')">' + r.ph + '</strong>' +
      '</td>' +
      '<td>' + zbadge(r.zone) + '</td>' +
      '<td>' + r.gm + '</td>' +
      '<td>' + r.rm + '</td>' +
      '<td>' + r.am + '</td>' +
      cells(r) +
      '</tr>' +

      '<tr id="' + subId + '" style="display:none;background:#f8fafc">' +
      '<td colspan="' + totalCols + '" style="padding:4px 16px 12px 28px">' +
      '<div class="sub-table-container">' +
      '<div style="font-weight:700;font-size:11px;color:var(--navy2)">📅 Date-wise Breakdown for ' + r.ph + '</div>' +
      '<table class="sub-table">' +
      '<thead><tr>' +
      '<th>Date</th>' +
      '<th class="r">Picked Count</th>' +
      (sA ? '<th class="r">Attempt</th>' : '') +
      (sE ? '<th class="r">EKL</th>' : '') +
      (sR ? '<th class="r">Auto Reset</th>' : '') +
      (sD ? '<th class="r">Dispatch</th>' : '') +
      '<th class="r">Total</th>' +
      '</tr></thead>' +
      '<tbody>' + dateRows + '</tbody>' +
      '</table>' +
      '</div>' +
      '</td>' +
      '</tr>';
  });

  body +=
    '<tr class="rt">' +
    '<td colspan="5">' + (showAverage ? 'Average Daily Total' : 'Grand Total') + '</td>' +
    cells(gt) +
    '</tr>' +
    '</tbody>';

  tbl.innerHTML = header + body;
}

function toggleHubSubRow(subId,btnId){
  const row = document.getElementById(subId);
  const button = document.getElementById(btnId);

  if(!row) return;

  if(row.style.display === 'none'){
    row.style.display = 'table-row';
    button.innerHTML = '▼';
  }else{
    row.style.display = 'none';
    button.innerHTML = '▶';
  }
}

function doSort(sec,col){
  const ss = sortState[sec];
  if(ss.col === col){
    ss.asc = !ss.asc;
  }else{
    ss.col = col;
    ss.asc = col < 5;
  }
  renderSec(sec);
}

function downloadRaw(){
  if(!filtered || !filtered.length){
    alert('No data to export.');
    return;
  }

  const keys = Object.keys(filtered[0]);
  const csvRows = [];

  csvRows.push(keys.join(','));

  filtered.forEach(row => {
    const values = keys.map(k => {
      const val = row[k] === null || row[k] === undefined ? '' : row[k];
      return '"' + String(val).replace(/"/g, '""') + '"';
    });
    csvRows.push(values.join(','));
  });

  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.setAttribute('href', url);
  link.setAttribute('download', 'FM_Breach_Data_' + new Date().toISOString().slice(0,10) + '.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

window.addEventListener('DOMContentLoaded', loadData);

</script>
